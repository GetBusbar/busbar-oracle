name: ci

# The oracle judges other people's binaries, so its own CI has to be the boring kind:
# pinned actions, a pinned interpreter, no network in the test job, and self-tests that
# prove the judge before anything is released.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      # NO FALLBACK. This was `--require-hashes -r requirements-dev.txt || pip install "ruff==0.8.4"`
      # against a requirements-dev.txt that did not exist, so the pinned path failed on every run and
      # the unpinned one always took over -- the digest pin was decorative, and would have stayed
      # decorative on the day it started mattering. The file exists now, and an install that cannot
      # satisfy it is a red job rather than a quiet downgrade.
      - name: install ruff
        run: pip install --require-hashes -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check . || true  # formatting is advisory: the drivers' layout is part of the record
      - name: bash -n every shipped driver
        run: |
          set -euo pipefail
          rc=0
          for f in src/busbar_oracle/*.sh src/busbar_oracle/fleet_fixtures/*.sh; do
            bash -n "$f" || { echo "::error file=$f::bash syntax"; rc=1; }
          done
          exit $rc

  selftest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e .
      # THE RECORDER'S OWN INTERPRETER REQUIREMENT, INSTALLED FOR THE SELF-TEST THAT NEEDS IT.
      # apply-mutation.py parses the config document, so it needs PyYAML; the package deliberately
      # does not depend on it (see pyproject's `dependencies = []`, and requirements-dev.txt's note).
      # replay-selftest's mutation-fixture case refuses to skip itself, so without this the job is
      # red rather than quietly proving nothing.
      - name: install the dev pins (pyyaml, for the mutation self-test)
        run: pip install --require-hashes -r requirements-dev.txt
      - name: the entrypoint resolves every shipped driver
        run: busbar-oracle --help
      - name: apply-mutation's own arms, including the data-dir fixture seam
        run: busbar-oracle --data tests/fixture-product/data apply-mutation --selftest
      - name: the merge provenance rule
        run: busbar-oracle --data tests/fixture-product/data merge --selftest
      # THE FIXTURE PRODUCT. A stub binary with a handful of cells, so the tool's own
      # self-tests need no real product -- the point of the move was that the tool does
      # not know what it is judging.
      - name: fixture product selftest
        run: bash tests/fixture-product/selftest.sh
      - name: fixture gate, both arms
        run: busbar-oracle --data tests/fixture-product/data fixture-gate-selftest
      - name: the judge judges itself
        run: busbar-oracle --data tests/fixture-product/data replay-selftest
      # THE DRIVER UNIT TESTS. The `--selftest` steps above are what a maintainer runs on a machine
      # with nothing installed, and they stay; these are the thing a --selftest cannot do well --
      # one named, independently-reported assertion per behaviour, so a regression says which of
      # 130 behaviours broke instead of "RED (1 failing)". Every server they start binds an
      # EPHEMERAL port, so the job needs no port allocation and cannot collide with itself.
      - name: the driver unit tests
        run: python -m pytest tests -q

  # The revision of "what records and judges" must be stable for a given tree, or every
  # golden that carries it is unverifiable. Two runs, same answer.
  harness-rev-is-deterministic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: same tree, same rev
        run: |
          set -euo pipefail
          a=$(busbar-oracle --data tests/fixture-product/data harness-rev)
          b=$(LC_ALL=en_US.UTF-8 busbar-oracle --data tests/fixture-product/data harness-rev)
          echo "$a"; echo "$b"
          [ "$a" = "$b" ] || { echo "::error::harness_rev is not locale-stable"; exit 1; }
