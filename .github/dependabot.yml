# Dependency updates target main. Every update of an ecosystem is ONE grouped PR, and
# .github/workflows/dependabot-bundle.yml folds all of them into one branch and one PR.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  target-branch: main
  groups:
    all:
      patterns:
      - '*'
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  target-branch: main
  groups:
    all:
      patterns:
      - '*'
